name: tests

on:
  push:
    branches: [main]        # теги не должны запускать тот же прогон второй раз
  pull_request:
  workflow_dispatch:

jobs:
  suites:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Зависимости ОПЦИОНАЛЬНЫ: приложение обязано работать на голом Python.
      # Ставим их, чтобы проверить и быстрый путь тоже; падение установки не ломает CI.
      - name: optional deps
        shell: bash
        run: python -m pip install -r requirements.txt || echo "::warning::optional deps не встали — чисто-python путь всё равно будет проверен"

      - name: regenerate samples
        shell: bash
        run: python tools/make_samples.py

      - name: selftest
        shell: bash
        run: python app/main.py --selftest

      - name: test_engine
        shell: bash
        run: python -u tests/test_engine.py

      - name: test_app
        shell: bash
        run: python -u tests/test_app.py

      - name: test_nodeps (app without numpy/mss/Pillow)
        shell: bash
        run: python -u tests/test_nodeps.py

      - name: test_reshade_sync
        shell: bash
        run: python -u tests/test_reshade_sync.py

      - name: "test_updater (self-update, offline: fake HTTP inside the repo)"
        shell: bash
        run: python -u tests/test_updater.py

      # --check на GitHub-раннере может резонно отказаться (виртуальный дисплей),
      # поэтому проверяем только что он не падает с traceback'ом.
      - name: gamma probe (may legitimately fail on a VM display)
        shell: bash
        run: python -u app/main.py --check || true

      # Репортер HANDOFF §8: на английской Windows консоль cp1252, и любая
      # кириллическая печать падает с UnicodeEncodeError. Прогон в cp1252 ловит это.
      - name: "suites under cp1252 console (Windows-1252 trap)"
        shell: bash
        if: matrix.os == 'windows-latest'
        env:
          PYTHONIOENCODING: cp1252
        run: |
          python -u app/main.py --selftest
          python -u tests/test_engine.py
          python -u tests/test_updater.py

  gui:
    # Tkinter-окно: без дисплея его не собрать, поэтому Xvfb. Раньше этот тест
    # в CI не бегал вовсе — и именно в нём сидело больше всего живых багов.
    name: GUI smoke (Xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk >/dev/null
      - name: optional deps (numpy ускоряет кадры; без него тест рисует их сам)
        shell: bash
        run: python -m pip install -r requirements.txt || echo "::warning::без numpy — тест умеет сам рисовать кадры"
      - name: test_gui
        run: xvfb-run -a python -u tests/test_gui.py

  exe:
    # Сборка TarkovBright.exe, чтобы артефакт можно было скачать с Actions.
    # continue-on-error: падение PyInstaller не делает красный CI — приложение
    # на .py от этого не перестаёт работать.
    name: build exe (artifact)
    if: github.event_name != 'pull_request'
    continue-on-error: true
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: pyinstaller
        run: python -m pip install pyinstaller
      - name: build
        run: python -m PyInstaller --noconfirm --clean --onefile --noconsole --name TarkovBright --paths app app\main.py
      - name: selftest of the exe
        run: dist\TarkovBright.exe --selftest
      - uses: actions/upload-artifact@v4
        with:
          name: TarkovBright-exe
          path: dist/TarkovBright.exe
          if-no-files-found: warn
