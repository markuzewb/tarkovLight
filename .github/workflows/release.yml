name: release

# «Скачал один файл — и всё работает». На тег v* собираем TarkovBright и кладём
# его в GitHub Release; ссылка всегда одна и та же, логин не нужен:
#   https://github.com/markuzewb/tarkovLight/releases/latest/download/TarkovBright.zip
#
# Почему архив, а не только .exe: onefile-сборка PyInstaller распаковывается в
# %TEMP% и запускается оттуда, а unsigned-экзешник с таким поведением — это
# ровно то, что ловит Windows Defender по эвристике («файл содержит вирус или
# потенциально нежелательную программу»), и человек получает отказ вместо окна.
# Onedir так не делает, поэтому в релизе два ассета:
#   TarkovBright.zip       — рекомендуемый (папка TarkovBright\TarkovBright.exe)
#   TarkovBright.exe       — onefile, для тех, у кого антивирус не мешает
# Версия внутри exe обязана совпадать с тегом и app/version.py — это отдельная проверка.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  exe:
    name: TarkovBright (zip + exe) → Release
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                 # нужен сам тег: из него берём текст релиза

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: pyinstaller
        run: python -m pip install pyinstaller

      - name: version-info для exe (из app/version.py)
        shell: bash
        run: python tools/make_version_file.py build/version-info.txt

      - name: build one-dir и one-file
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir  --noconsole --name TarkovBright --paths app --version-file build\version-info.txt app\main.py
          python -m PyInstaller --noconfirm --clean --onefile --noconsole --name TarkovBright --paths app --version-file build\version-info.txt app\main.py
          Compress-Archive -Path dist\TarkovBright -DestinationPath dist\TarkovBright.zip -Force
          Get-ChildItem dist\TarkovBright.zip, dist\TarkovBright.exe | Select-Object Name, Length

      # bash, а не pwsh: в pwsh «exit 1» внутри if + LASTEXITCODE давал провал
      # шага при обоих успешных selftest'ах (лог v1.3.1). Здесь коды собираются
      # явно и печатаются — при следующем рассинхроне будет видно, кто именно упал.
      - name: selftest обеих сборок
        shell: bash
        env:
          TARKOVBRIGHT_QUIET: '1'        # диалог в CI некому закрыть
        run: |
          rc1=0; rc2=0
          ./dist/TarkovBright/TarkovBright.exe --selftest || rc1=$?
          ./dist/TarkovBright.exe --selftest || rc2=$?
          echo "коды возврата: onedir=$rc1 onefile=$rc2"
          [ "$rc1" = 0 ] && [ "$rc2" = 0 ]

      # Тег и версия внутри файла обязаны совпадать, иначе «Обновить» врёт:
      # «скачай новый файл», когда новый файл уже в руках.
      - name: version in exe matches the tag
        shell: bash
        env:
          TARKOVBRIGHT_QUIET: '1'
        run: |
          set -e
          tag=$(echo "$TAG" | sed 's/^[vV]//')
          src=$(python -c "import sys;sys.path.insert(0,'app');import version;print(version.__version__)")
          echo "app/version.py: $src | тег: $tag"
          case "$src" in "$tag"*) ;; *) echo "::error::тег $TAG, а в app/version.py $src"; exit 1;; esac
          # без `head -1`: закрытый pipe + GUI-подсистема = битый канал у print()
          for exe in ./dist/TarkovBright/TarkovBright.exe ./dist/TarkovBright.exe; do
            out=$($exe --version)
            echo "в $exe: $(echo "$out" | tr -d '\r' | head -1)"
            case "$out" in *"$tag"*) ;; *) echo "::error::в $exe версия не $tag"; exit 1;; esac
          done

      - name: release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "### Как запустить"
            echo
            echo "1. Скачай **\`TarkovBright.zip\`** (\`$(stat -c%s dist/TarkovBright.zip 2>/dev/null || wc -c < dist/TarkovBright.zip)\` байт)."
            echo "2. Распакуй в любое место — появится папка \`TarkovBright\`; двойным кликом"
            echo "   запусти в ней \`TarkovBright\\TarkovBright.exe\`. Python не нужен."
            echo "3. Хоткеи в игре: F8 вкл/выкл, F7 сброс, F9 буст 12 с, F10 профиль."
            echo
            echo "Прямая ссылка на архив: <https://github.com/$GITHUB_REPOSITORY/releases/latest/download/TarkovBright.zip>"
            echo
            echo "Файлы и контрольные суммы (проверить: \`certutil -hashfile TarkovBright.zip SHA256\`):"
            echo
            echo "| файл | размер | SHA-256 |"
            echo "|---|---|---|"
            for f in dist/TarkovBright.zip dist/TarkovBright.exe; do
              n=$(basename "$f"); s=$(stat -c%s "$f" 2>/dev/null || wc -c < "$f")
              h=$(sha256sum "$f" | cut -c1-64)
              echo "| \`$n\` | $s байт | \`$h\` |"
            done
            echo
            echo "### Если Windows ругается на \`TarkovBright.exe\`"
            echo
            echo "Одинокий .exe Defender часто берёт «на подозрение» не из-за содержимого, а из-за"
            echo "формы: не подписан и распаковывается во временный каталог. **Качайте архив** — он"
            echo "этого не делает. Если всё же блокирует: «Безопасность Windows» → «Журнал защиты» →"
            echo "это событие → «Действия» → «Разрешить на устройстве» (сверьте SHA-256 с таблицей выше)."
            echo
            echo "---"
            echo
            # Текст релиза = сообщение тега. actions/checkout иногда приносит тег
            # «обрезанным» (тогда %(contents) отдаёт сообщение коммита), поэтому
            # сначала дотягиваем сам ref тега, а если и так пусто — берём из API.
            git fetch -q origin "+refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null || true
            notes=$(git tag -l --format='%(contents)' "$TAG" | sed '/./,$!d')
            if [ -z "$notes" ] || [ "$notes" = "$(git log -1 --format=%s "$TAG" 2>/dev/null)" ]; then
              obj=$(gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" --jq '.object.sha' 2>/dev/null || echo "")
              if [ -n "$obj" ] && [ "$(gh api "repos/$GITHUB_REPOSITORY/git/objects/$obj" --jq '.type' 2>/dev/null)" = tag ]; then
                notes=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$obj" --jq '.message')
              fi
            fi
            printf '%s\n' "$notes"
          } > release-notes.md

      - name: create release and upload the assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "TarkovBright $TAG" --notes-file release-notes.md
          else
            gh release edit "$TAG" --notes-file release-notes.md
          fi
          gh release upload "$TAG" dist/TarkovBright.zip --clobber
          gh release upload "$TAG" dist/TarkovBright.exe --clobber
          gh release view "$TAG" --json tagName,assets,url --jq '{tag:.tagName,url:.url,assets:[.assets[].name]}'
