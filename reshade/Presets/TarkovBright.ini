; Tarkov Bright — пресет ReShade для EFT
; Положить рядом с dxgi.ini (обычно рядом с EscapeFromTarkov.exe),
; в игре нажать Home -> Presets -> выбрать TarkovBright.ini
; Имена ключей = имена uniform-переменных из TarkovBright.fx.

[Techniques]
Techniques=TarkovBrightVisibility

[TarkovBrightVisibility]
TarkovBrightVisibility/Main/Enable=1
TarkovBrightVisibility/Main/PreprocessorDefines=

[TarkovBright.fx]
TB_Enable=1
TB_Gamma=1.450000
TB_ShadowDetail=0.500000
TB_BlackPoint=0.450000
TB_ShadowLift=0.100000
TB_Highlight=0.300000
TB_TintCast=159,199,242
TB_TintAmount=0.350000
TB_Saturation=1.150000
TB_Vignette=0.550000
TB_Clarity=0.250000
TB_ClarityRadius=3.000000
TB_Dither=0.650000
TB_ShowMask=0
